        }

        .tmi-filter-label {
            min-width: 0;
            overflow-wrap: anywhere;
        }

        .tmi-clear-filter {
            flex: none;
            padding: 4px 0 4px 8px;
            border: 0;
            background: transparent;
            color: #4a78a8;
            font: inherit;
            font-size: 10px;
            cursor: pointer;
        }

        .tmi-clear-filter:hover {

        }

        .tmi-empty {

<script>
    const tmiState = {
        items: [],
        activeTag: null
    };

    async function loadTmi() {
        const container = document.getElementById('tmi-list');

        try {
            const response = await fetch('data/tmi.json');

            if (!response.ok) {
                throw new Error('Failed to load tmi.json');
            }

            const data = await response.json();

            if (!data || !Array.isArray(data.items)) {
                throw new Error('Invalid tmi.json format');
            }

            tmiState.items = data.items
                .map((item, index) => ({ item, index }))
                .filter(({ item }) =>
                    item &&
                    typeof item.text === 'string' &&
                    item.text.trim()
                )
                .sort((a, b) => {
                    const yearA = Number(a.item.year) || 0;
                    const yearB = Number(b.item.year) || 0;
                    return yearB - yearA || a.index - b.index;
                })
                .map(({ item }) => item);

            renderTmi();

        } catch (error) {
            console.error('TMI:', error);
            showTmiMessage(container, 'Failed to load content.');
        }
    }

    function renderTmi() {
        const container = document.getElementById('tmi-list');

        const items = tmiState.activeTag
            ? tmiState.items.filter(item =>
                Array.isArray(item.tags) &&
                item.tags.includes(tmiState.activeTag)
            )
            : tmiState.items;

        updateFilterBar(items.length);

        container.replaceChildren();

        if (!items.length) {
            showTmiMessage(container, 'No items found for this tag.');
            return;
        }

        items.forEach(item => {
            const row = document.createElement('article');
            row.className = 'tmi-item';

            const year = document.createElement('span');
            year.className = 'tmi-year';
            year.textContent = item.year ? item.year : '';

            const content = document.createElement('div');
            content.className = 'tmi-content';

            const text = document.createElement('span');
            text.className = 'tmi-text';

            if (item.focus && item.focus !== '김수현') {
                text.classList.add('tmi-text-other');
            }

            if (Array.isArray(item.tags) &&
                item.tags.some(tag =>
                    ['fact check', 'privacy'].includes(tag.trim().toLowerCase())
                )) {
                text.classList.add('tmi-text-fact-check');
            }

            text.textContent = item.text;
            content.appendChild(text);

            renderLinks(item.links, content);
            renderTags(item.tags, content);

            row.appendChild(year);
            row.appendChild(content);
            container.appendChild(row);
        });
    }

    function renderLinks(links, container) {
        if (!Array.isArray(links) || !links.length) {
            return;
        }

        const linkList = document.createElement('span');
        linkList.className = 'tmi-links';

        links.forEach(link => {
            if (!link || typeof link.url !== 'string') {
                return;
            }

            try {
                const url = new URL(link.url);

                if (url.protocol !== 'https:' && url.protocol !== 'http:') {
                    return;
                }

                const anchor = document.createElement('a');
                anchor.href = url.href;
                anchor.target = '_blank';
                anchor.rel = 'noopener noreferrer';

                const label = link.label || link.kind || 'LINK';
                anchor.textContent = label + ' ↗';

                linkList.appendChild(anchor);
            } catch {
                // 유효하지 않은 URL은 표시하지 않음
            }
        });

        if (linkList.childElementCount) {
            container.appendChild(linkList);
        }
    }

    function renderTags(tags, container) {
        if (!Array.isArray(tags) || !tags.length) {
            return;
        }

        const tagList = document.createElement('div');
        tagList.className = 'tmi-tags';
        tagList.setAttribute('aria-label', 'tag');

        tags.forEach(tag => {
            if (typeof tag !== 'string' || !tag.trim()) {
                return;
            }

            const button = document.createElement('button');
            button.type = 'button';
            button.className = 'tmi-tag';
            button.textContent = `#${tag}`;
            button.setAttribute(
                'aria-pressed',
                String(tmiState.activeTag === tag)
            );
            button.setAttribute('aria-label', `Filter by tag ${tag}`);

            button.addEventListener('click', () => {
                tmiState.activeTag =
                    tmiState.activeTag === tag ? null : tag;

                renderTmi();
            });

            tagList.appendChild(button);
        });

        if (tagList.childElementCount) {
            container.appendChild(tagList);
        }
    }

    function updateFilterBar(resultCount) {
        const bar = document.getElementById('tmi-filter-bar');
        const label = document.getElementById('tmi-filter-label');
        const clearButton = document.getElementById('tmi-clear-filter');

        if (!tmiState.activeTag) {
            bar.classList.remove('visible');
            label.textContent = '';
            return;
        }

        bar.classList.add('visible');
        label.textContent =
            `TAG: ${tmiState.activeTag} · ${resultCount}`;

        clearButton.onclick = () => {
            tmiState.activeTag = null;
            renderTmi();
        };
    }

    function showTmiMessage(container, message) {
        const empty = document.createElement('div');
        empty.className = 'tmi-empty';
        empty.textContent = message;
        container.replaceChildren(empty);
    }

    loadTmi();
</script>

<script>
    const backToTop = document.getElementById('backToTop');

    window.addEventListener('scroll', () => {
        backToTop.classList.toggle('show', window.scrollY > 600);
    });

    backToTop.addEventListener('click', () => {
        const prefersReducedMotion = window.matchMedia(
            '(prefers-reduced-motion: reduce)'
        ).matches;

        window.scrollTo({
            top: 0,
            behavior: prefersReducedMotion ? 'auto' : 'smooth'
        });
    });
</script>
