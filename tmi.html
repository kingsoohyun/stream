<script>
    async function loadTmi() {
        const container = document.getElementById('tmi-list');

        try {
            const response = await fetch('data/random_messages.json');

            if (!response.ok) {
                throw new Error('Failed to load random_messages.json');
            }

            const data = await response.json();

            if (!Array.isArray(data)) {
                throw new Error('Invalid random_messages.json format');
            }

            const items = data
                .map((item, index) => ({ item, index }))
                .filter(({ item }) =>
                    item &&
                    typeof item.text === 'string' &&
                    item.text.trim()
                )
                .sort((a, b) => {
                    const yearA = Number(a.item.year) || 0;
                    const yearB = Number(b.item.year) || 0;

                    return yearB - yearA || a.index - b.index;
                });

            container.replaceChildren();

            if (!items.length) {
                showTmiMessage(container, '표시할 항목이 없습니다.');
                return;
            }

            items.forEach(({ item }) => {
                const row = document.createElement('article');
                row.className = 'tmi-item';

                const year = document.createElement('span');
                year.className = 'tmi-year';
                year.textContent = item.year ? item.year : '';

                const content = document.createElement('div');
                content.className = 'tmi-content';

                const text = document.createElement('div');
                text.className = 'tmi-text';
                text.textContent = item.text;

                content.appendChild(text);

                if (item.url) {
                    try {
                        const url = new URL(item.url);

                        if (url.protocol === 'https:' || url.protocol === 'http:') {
                            const link = document.createElement('a');
                            link.className = 'tmi-source';
                            link.href = url.href;
                            link.target = '_blank';
                            link.rel = 'noopener noreferrer';
                            link.textContent = 'View ↗';

                            content.appendChild(link);
                        }
                    } catch {
                        // 유효하지 않은 URL은 링크로 표시하지 않음
                    }
                }

                row.appendChild(year);
                row.appendChild(content);
                container.appendChild(row);
            });

        } catch (error) {
            console.error('TMI:', error);
            showTmiMessage(container, 'TMI를 불러오지 못했습니다.');
        }
    }

    function showTmiMessage(container, message) {
        const empty = document.createElement('div');
        empty.className = 'tmi-empty';
        empty.textContent = message;
        container.replaceChildren(empty);
    }

    loadTmi();
</script>

<script>
    const backToTop = document.getElementById('backToTop');

    window.addEventListener('scroll', () => {
        backToTop.classList.toggle('show', window.scrollY > 600);
    });

    backToTop.addEventListener('click', () => {
        const prefersReducedMotion = window.matchMedia(
            '(prefers-reduced-motion: reduce)'
        ).matches;

        window.scrollTo({
            top: 0,
            behavior: prefersReducedMotion ? 'auto' : 'smooth'
        });
    });
</script>
