        /* =========================================================
           Social Calendar
           ========================================================= */

        .social-page {
            max-width: 760px;
            margin: 0 auto;
            padding: 28px 24px 10px;
        }

        /* =========================================================
           Calendar Header
           ========================================================= */

        .social-calendar {
            margin-top: 0;
        }

        .social-calendar-head {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }

        .social-month-nav {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .social-month-button {
            width: 28px;
            height: 28px;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 0;

            border: 0;
            border-radius: 50%;

            background: transparent;
            color: #8b9098;

            font-size: 17px;
            line-height: 1;
            font-weight: 600;

            cursor: pointer;

            transition:
                    background .15s ease,
                    color .15s ease;
        }

        .social-month-button:hover {
            background: #f1f2f4;
            color: #151922;
        }

        .social-month-title {
            min-width: 150px;

            margin: 0;

            text-align: center;

            font-size: 22px;
            line-height: 1.2;

            font-weight: 600;
            letter-spacing: -.035em;

            color: #151922;
        }

        .social-today-button {
            padding: 5px 9px;

            border: 1px solid #e5e7eb;
            border-radius: 6px;

            background: #fff;
            color: #858b95;

            font-size: 10px;
            font-weight: 500;
            line-height: 1;

            cursor: pointer;

            transition:
                    background .15s ease,
                    border-color .15s ease,
                    color .15s ease;
        }

        .social-today-button:hover {
            background: #f5f6f8;
            border-color: #d5d9df;
            color: #151922;
        }


        /* =========================================================
           Weekdays
           ========================================================= */

        .social-calendar-weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);

            margin-bottom: 3px;
        }

        .social-weekday {
            padding: 5px 0;

            text-align: center;

            font-size: 9px;
            font-weight: 500;
            letter-spacing: .03em;

            color: #9a9fa7;
        }


        /* =========================================================
           Calendar Grid
           ========================================================= */

        .social-calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);

            row-gap: 2px;
        }

        .social-calendar-day {
            position: relative;

            min-height: 58px;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;

            padding: 7px 4px 5px;

            border: 0;
            background: transparent;

            color: #151922;

            cursor: default;
        }

        .social-calendar-day.empty {
            background: transparent;
        }

        .social-calendar-day.has-posts {
            cursor: pointer;
        }

        .social-calendar-day.has-posts:hover {
            background: transparent;
        }


        /* =========================================================
           Date
           ========================================================= */

        .social-calendar-month {
            display: none;
        }

        .social-calendar-number {
            width: 30px;
            height: 30px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            font-size: 17px;
            line-height: 1;

            font-weight: 400;
            letter-spacing: -.03em;

            color: #252932;
        }

        .social-calendar-day.has-posts
        .social-calendar-number {
            font-weight: 500;
        }

        .social-calendar-day.today:not(.selected)
        .social-calendar-number {
            text-decoration: underline;
            text-decoration-thickness: 1px;
            text-underline-offset: 8px;
        }


        /* =========================================================
           Weekend
           ========================================================= */

        .social-calendar-day.sunday .social-calendar-number {
            color: #c64f59;
        }

        .social-calendar-day.saturday .social-calendar-number {

           Post Indicator
           ========================================================= */

           Selected Date

<script>


    /* =========================================================
       Helpers
       ========================================================= */

    function escapeHtml(s) {

        return String(s ?? "")
            .replace(
                /[&<>"']/g,
                m => ({
                    "&": "&amp;",
                    "<": "&lt;",
                    ">": "&gt;",
                    '"': "&quot;",
                    "'": "&#039;"
                }[m])
            );

    }


    function parseDate(value) {

        const [
            year,
            month,
            day
        ] = String(value)
            .split(".")
            .map(Number);


        return new Date(
            year,
            month - 1,
            day
        );

    }


    function formatMonth(year, month) {

        return new Date(
            year,
            month,
            1
        ).toLocaleString(
            "en-US",
            {
                month: "long",
                year: "numeric"
            }
        );

    }


    function formatLongDate(key) {

        const date =
            parseDate(key);


        return date.toLocaleDateString(
            "en-US",
            {
                month: "short",
                day: "numeric",
                year: "numeric"
            }
        );

    }


    /* =========================================================
       State
       ========================================================= */

    let socialItems = [];

    let currentYear = 0;
    let currentMonth = 0;

    let selectedDate = "";


    /* =========================================================
       Platform
       ========================================================= */

    const platformNames = {

        instagram: "INSTAGRAM",

        youtube: "YouTube",

        tiktok: "TIKTOK",

        threads: "THREADS",

        x: "\uD835\uDD4F",

        weibo: "WEIBO"

    };


    function getPlatformName(value) {

        const key =
            String(value || "")
                .toLowerCase();


        return platformNames[key] ||
            String(value || "")
                .toUpperCase();

    }


    /* =========================================================
       Group Posts By Date
       ========================================================= */

    function groupByDate(items) {

        const groups = {};


        items.forEach(item => {

            const key =
                String(item.date);


            if (!groups[key]) {
                groups[key] = [];
            }


            groups[key].push(item);

        });


        return groups;

    }


    /* =========================================================
       Render Calendar
       ========================================================= */

    function renderCalendar() {

        const container =
            document.getElementById(
                "social-list"
            );


        if (!container) {
            return;
        }


        const dateGroups =
            groupByDate(socialItems);


        const firstDay =
            new Date(
                currentYear,
                currentMonth,
                1
            );


        const lastDay =
            new Date(
                currentYear,
                currentMonth + 1,
                0
            );


        const firstWeekday =
            firstDay.getDay();


        const daysInMonth =
            lastDay.getDate();


        let calendarDays = "";


        /* Empty cells before month */

        for (
            let i = 0;
            i < firstWeekday;
            i++
        ) {

            calendarDays += `
                <div
                    class="social-calendar-day empty"
                    aria-hidden="true"
                ></div>
            `;

        }


        /* Actual days */

        for (
            let day = 1;
            day <= daysInMonth;
            day++
        ) {

            const key =
                `${currentYear}.${String(
                    currentMonth + 1
                ).padStart(2, "0")}.${String(
                    day
                ).padStart(2, "0")}`;


            const posts =
                dateGroups[key] || [];


            const hasPosts =
                posts.length > 0;


            const isSelected =
                key === selectedDate &&
                hasPosts;

            const todayKey = getTodayKey();

            const isToday =
                key === todayKey;


            const weekday = new Date(
                currentYear,
                currentMonth,
                day
            ).getDay();



            const classes = [
                "social-calendar-day",

                weekday === 0
                    ? "sunday"
                    : "",

                weekday === 6
                    ? "saturday"
                    : "",

                hasPosts
                    ? "has-posts"
                    : "",

                isSelected
                    ? "selected"
                    : "",

                isToday
                    ? "today"
                    : ""
            ]
                .filter(Boolean)
                .join(" ");



            calendarDays += `

                <button
                    type="button"
                    class="${classes}"
                    data-date="${escapeHtml(key)}"
                    ${hasPosts ? "" : "disabled"}
                    aria-label="${escapeHtml(key)}"
                >

                    <span
                        class="social-calendar-month"
                    >
                        ${new Date(
                currentYear,
                currentMonth,
                day
            )
                .toLocaleString(
                    "en-US",
                    {
                        month: "short"
                    }
                )
                .toUpperCase()}
                    </span>


                    <strong
                        class="social-calendar-number"
                    >
                        ${day}
                    </strong>


                    ${
                hasPosts
                    ? `
                    <span
                        class="social-calendar-dots"
                        aria-hidden="true"
                    >
                        ${Array.from(
                        {
                            length: 1
                        },
                        () =>
                            `<span class="social-calendar-dot"></span>`
                    ).join("")}
                    </span>
                `
                    : ""
            }

                </button>

            `;

        }


        /* =====================================================
           Calendar HTML
           ===================================================== */

        container.innerHTML = `

            <div class="social-calendar">


                <div class="social-calendar-head">

                    <div class="social-month-nav">


                        <button
                            type="button"
                            class="social-month-button"
                            id="social-prev"
                            aria-label="Previous month"
                        >
                            ←
                        </button>


                        <h1
                            class="social-month-title"
                            id="social-month-title"
                        >
                            ${formatMonth(
            currentYear,
            currentMonth
        )}
                        </h1>


                        <button
                            type="button"
                            class="social-month-button"
                            id="social-next"
                            aria-label="Next month"
                        >
                            →
                        </button>


                        <button
                            type="button"
                            class="social-today-button"
                            id="social-today"
                        >
                            Today
                        </button>


                    </div>

                </div>


                <div class="social-calendar-weekdays">

                    <span class="social-weekday">
                        SUN
                    </span>

                    <span class="social-weekday">
                        MON
                    </span>

                    <span class="social-weekday">
                        TUE
                    </span>

                    <span class="social-weekday">
                        WED
                    </span>

                    <span class="social-weekday">
                        THU
                    </span>

                    <span class="social-weekday">
                        FRI
                    </span>

                    <span class="social-weekday">
                        SAT
                    </span>

                </div>


                <div class="social-calendar-grid">

                    ${calendarDays}

                </div>

                <div
                    class="social-date-preview"
                    id="social-date-preview"
                    role="dialog"
                    aria-label="Social post preview"
                    aria-live="polite"
                ></div>


            </div>

        `;


        /* =====================================================
           Month Navigation
           ===================================================== */

        document
            .getElementById("social-prev")
            .addEventListener(
                "click",
                () => changeMonth(-1)
            );


        document
            .getElementById("social-next")
            .addEventListener(
                "click",
                () => changeMonth(1)
            );


        document
            .getElementById("social-today")
            .addEventListener(
                "click",
                goToToday
            );

        /* =====================================================
           Mobile Swipe
           ===================================================== */

        const calendarGrid =
            document.querySelector(".social-calendar-grid");

        let touchStartX = 0;
        let touchStartY = 0;

        calendarGrid.addEventListener(
            "touchstart",
            event => {
                const touch = event.touches[0];
                touchStartX = touch.clientX;
                touchStartY = touch.clientY;
            },
            { passive: true }
        );

        calendarGrid.addEventListener(
            "touchend",
            event => {
                const touch = event.changedTouches[0];

                const deltaX = touch.clientX - touchStartX;
                const deltaY = touch.clientY - touchStartY;

                if (
                    Math.abs(deltaX) < 50 ||
                    Math.abs(deltaX) <= Math.abs(deltaY)
                ) {
                    return;
                }

                changeMonth(deltaX < 0 ? 1 : -1);
            },
            { passive: true }
        );

        /* =====================================================
           Date Preview Interaction
           ===================================================== */

        const preview = document.getElementById("social-date-preview");
        const dateButtons = document.querySelectorAll(".social-calendar-day.has-posts");
        let previewDate = "";
        let previewIndex = 0;
        let hidePreviewTimer = null;

        function openDatePreview(dateKey, button, index = 0) {
            const posts = dateGroups[dateKey] || [];
            if (!posts.length || !preview) return;

            previewDate = dateKey;
            previewIndex = Math.max(0, Math.min(index, posts.length - 1));
            renderDatePreview();

            const rect = button
                ? button.getBoundingClientRect()
                : document.querySelector(`[data-date="${dateKey}"]`)?.getBoundingClientRect();

            if (rect) {
                const popupWidth = Math.min(300, window.innerWidth - 24);
                const popupHeight = preview.offsetHeight || 190;
                let left = rect.left + rect.width / 2 - popupWidth / 2;
                left = Math.max(12, Math.min(left, window.innerWidth - popupWidth - 12));

                let top = rect.bottom + 8;
                if (top + popupHeight > window.innerHeight - 8) {
                    top = rect.top - popupHeight - 8;
                }
                top = Math.max(8, Math.min(top, window.innerHeight - popupHeight - 8));

                preview.style.left = `${left}px`;
                preview.style.top = `${top}px`;
            }

            preview.classList.add("open");
        }

        function closeDatePreview() {
            if (!preview) return;
            preview.classList.remove("open");
        }

        function schedulePreviewClose() {
            clearTimeout(hidePreviewTimer);
            hidePreviewTimer = setTimeout(() => {
                if (!preview.matches(":hover") &&
                    !document.querySelector(".social-calendar-day:focus")) {
                    closeDatePreview();
                }
            }, 180);
        }

        function renderDatePreview() {
            const posts = dateGroups[previewDate] || [];
            const item = posts[previewIndex];
            if (!item || !preview) return;

            const desc = item.desc || item.account || "Social post";
            const account = item.account ? `@${item.account}` : "";
            const platform = getPlatformName(item.platform);

            preview.innerHTML = `
                <div class="social-preview-top">
                    <span class="social-preview-date">${escapeHtml(formatLongDate(previewDate))}</span>
                    <span class="social-preview-count">${previewIndex + 1} / ${posts.length}</span>
                </div>
                <div class="social-preview-content">
                    ${item.thumbnail
                        ? `<img class="social-preview-thumbnail" src="${escapeHtml(item.thumbnail)}" alt="" loading="lazy">`
                        : `<div class="social-preview-placeholder">No image</div>`}
                    <div class="social-preview-info">
                        <div class="social-preview-platform">${escapeHtml(platform)}</div>
                        <div class="social-preview-desc">${escapeHtml(desc)}</div>
                        ${account ? `<div class="social-preview-account">${escapeHtml(account)}</div>` : ""}
                    </div>
                </div>
                <div class="social-preview-controls">
                    <div class="social-preview-nav">
                        <button type="button" class="social-preview-button" data-preview-prev aria-label="Previous post" ${previewIndex === 0 ? "disabled" : ""}>‹</button>
                        <button type="button" class="social-preview-button" data-preview-next aria-label="Next post" ${previewIndex === posts.length - 1 ? "disabled" : ""}>›</button>
                    </div>
                    <a class="social-preview-open-link" href="${escapeHtml(item.url)}" target="_blank" rel="noopener noreferrer">Open post ↗</a>
                </div>
            `;

            preview.querySelector("[data-preview-prev]")?.addEventListener("click", event => {
                event.stopPropagation();
                if (previewIndex > 0) {
                    previewIndex--;
                    renderDatePreview();
                    repositionPreview();
                }
            });

            preview.querySelector("[data-preview-next]")?.addEventListener("click", event => {
                event.stopPropagation();
                if (previewIndex < posts.length - 1) {
                    previewIndex++;
                    renderDatePreview();
                    repositionPreview();
                }
            });
        }

        function repositionPreview() {
            const button = document.querySelector(`.social-calendar-day[data-date="${previewDate}"]`);
            if (button) openDatePreview(previewDate, button, previewIndex);
        }

        dateButtons.forEach(button => {
            button.addEventListener("mouseenter", () => {
                clearTimeout(hidePreviewTimer);
                openDatePreview(button.dataset.date, button);
            });

            button.addEventListener("mouseleave", schedulePreviewClose);

            button.addEventListener("focus", () => {
                openDatePreview(button.dataset.date, button);
            });

            button.addEventListener("click", event => {
                event.preventDefault();
                clearTimeout(hidePreviewTimer);

                selectedDate = button.dataset.date;
                document.querySelectorAll(".social-calendar-day.selected")
                    .forEach(dayButton => dayButton.classList.remove("selected"));
                button.classList.add("selected");

                const isTouchDevice = window.matchMedia("(hover: none), (pointer: coarse)").matches;
                if (isTouchDevice && previewDate === button.dataset.date && preview.classList.contains("open")) {
                    closeDatePreview();
                } else {
                    openDatePreview(button.dataset.date, button);
                }
            });
        });

        preview.addEventListener("mouseenter", () => clearTimeout(hidePreviewTimer));
        preview.addEventListener("mouseleave", schedulePreviewClose);

        /* Touch swipe between posts inside the preview */
        let previewTouchStartX = 0;
        let previewTouchStartY = 0;

        preview.addEventListener("touchstart", event => {
            const touch = event.touches[0];
            previewTouchStartX = touch.clientX;
            previewTouchStartY = touch.clientY;
        }, { passive: true });

        preview.addEventListener("touchend", event => {
            const touch = event.changedTouches[0];
            const dx = touch.clientX - previewTouchStartX;
            const dy = touch.clientY - previewTouchStartY;

            if (Math.abs(dx) < 35 || Math.abs(dx) <= Math.abs(dy)) return;

            const posts = dateGroups[previewDate] || [];
            if (dx < 0 && previewIndex < posts.length - 1) {
                previewIndex++;
            } else if (dx > 0 && previewIndex > 0) {
                previewIndex--;
            } else {
                return;
            }

            renderDatePreview();
            repositionPreview();
        }, { passive: true });

        if (!window.socialPreviewOutsideHandlerAdded) {
            window.socialPreviewOutsideHandlerAdded = true;
            document.addEventListener("pointerdown", event => {
                const currentPreview = document.getElementById("social-date-preview");
                if (currentPreview &&
                    !currentPreview.contains(event.target) &&
                    !event.target.closest(".social-calendar-day.has-posts")) {
                    currentPreview.classList.remove("open");
                }
            });
        }

        window.addEventListener("resize", () => {
            if (preview.classList.contains("open")) repositionPreview();
        });

        window.addEventListener("scroll", () => {
            if (preview.classList.contains("open")) closeDatePreview();
        }, { passive: true });

        /* Keep the calendar compact: previews replace the card list below. */
    }

    /* =========================================================
       Change Month
       ========================================================= */

    function changeMonth(offset) {

        let year = currentYear;
        let month = currentMonth;

        const today = new Date();
        const todayYear = today.getFullYear();
        const todayMonth = today.getMonth();

        const minDate =
            parseDate(
                socialItems[socialItems.length - 1].date
            );

        const minYear = minDate.getFullYear();
        const minMonth = minDate.getMonth();

        while (true) {

            month += offset;

            if (month < 0) {
                month = 11;
                year--;
            }

            if (month > 11) {
                month = 0;
                year++;
            }

            /* 미래의 달 */
            if (
                year > todayYear ||
                (
                    year === todayYear &&
                    month > todayMonth
                )
            ) {
                return;
            }

            /* 데이터보다 이전 */
            if (
                year < minYear ||
                (
                    year === minYear &&
                    month < minMonth
                )
            ) {
                return;
            }

            const monthPrefix =
                `${year}.${String(
                    month + 1
                ).padStart(2, "0")}`;

            const monthItems =
                socialItems.filter(item =>
                    String(item.date)
                        .startsWith(monthPrefix)
                );

            if (monthItems.length) {

                currentYear = year;
                currentMonth = month;

                selectedDate =
                    monthItems[0].date;

                renderCalendar();

                return;
            }
        }
    }


    /* =========================================================
       Go To Today
       ========================================================= */

    function goToToday() {

        const today = new Date();

        currentYear = today.getFullYear();
        currentMonth = today.getMonth();
        selectedDate = getTodayKey();

        renderCalendar();
    }


    /* =========================================================
       Render Selected Date Posts
       ========================================================= */

    function renderSelectedPosts(items) {

        const container =
            document.getElementById(
                "social-posts"
            );


        if (!container) {
            return;
        }


        if (
            !selectedDate ||
            !items.length
        ) {

            container.innerHTML = "";

            return;

        }


        const date =
            parseDate(selectedDate);


        const monthName =
            date
                .toLocaleString(
                    "en-US",
                    {
                        month: "short"
                    }
                )
                .toUpperCase();


        const day =
            String(
                date.getDate()
            );


        const cards =
            items
                .map(item => {

                    const desc =
                        item.desc ||
                        item.account ||
                        "";


                    const account =
                        item.account ||
                        "";


                    const platform =
                        getPlatformName(
                            item.platform
                        );


                    return `

                        <a
                            class="social-post-card"
                            href="${escapeHtml(item.url)}"
                            target="_blank"
                            rel="noopener noreferrer"
                        >

                            ${item.thumbnail ? `
                                <span class="social-post-preview">
                                    <img
                                        src="${escapeHtml(item.thumbnail)}"
                                        alt=""
                                    >
                                </span>
                            ` : ""}

                            <div class="social-post-date">

                                <span
                                    class="social-post-month"
                                >
                                    ${monthName}
                                </span>


                                <strong
                                    class="social-post-day"
                                >
                                    ${escapeHtml(day)}
                                </strong>

                            </div>


                            <div class="social-post-info">

                                <span
                                    class="social-post-desc"
                                >
                                    ${escapeHtml(desc)}
                                </span>


                                <span
                                    class="social-post-account"
                                >
                                    @${escapeHtml(account)}
                                </span>


                                <span
                                    class="social-post-platform"
                                >
                                    ${escapeHtml(platform)}
                                </span>

                            </div>


                            <span
                                class="social-post-arrow"
                                aria-hidden="true"
                            >
                                ↗
                            </span>


                        </a>

                    `;

                })
                .join("");


        container.innerHTML = `

            <div class="social-posts-head">

                <h2 class="social-posts-date">
                    ${formatLongDate(selectedDate)}
                </h2>

            </div>


            <div class="social-post-list">

                ${cards}

            </div>

        `;

    }


    function getTodayKey() {

        const today = new Date();

        return `${today.getFullYear()}.${String(
            today.getMonth() + 1
        ).padStart(2, "0")}.${String(
            today.getDate()
        ).padStart(2, "0")}`;

    }


    /* =========================================================
       Load Social Data
       ========================================================= */

    async function loadSocial() {

        const container =
            document.getElementById(
                "social-list"
            );

        try {
            const response =
                await fetch(
                    "data/social.json"
                );

            if (!response.ok) {
                throw new Error(
                    "Failed to load social content."
                );
            }

            const data =
                await response.json();


            socialItems =
                Array.isArray(data.items)

                    ? data.items

                        .filter(item =>
                            item.url &&
                            item.date &&
                            item.platform
                        )

                        .sort((a, b) =>
                            b.date.localeCompare(
                                a.date
                            )
                        )
                    : [];

            if (!socialItems.length) {
                container.innerHTML = `
                    <div class="social-empty">
                        No posts available.
                    </div>

                `;
                return;
            }


            /* Latest post */

            const latestDate =
                parseDate(
                    socialItems[0].date
                );

            currentYear =
                latestDate.getFullYear();

            currentMonth =
                latestDate.getMonth();
            selectedDate =
                socialItems[0].date;
            renderCalendar();
        } catch (error) {

            console.error(error);

            container.innerHTML = `

                <div class="social-empty">
                    A little pause in the stream.
                </div>

            `;
        }
    }
    loadSocial();
</script>

<script>
    const backToTop = document.getElementById("backToTop");

    window.addEventListener("scroll", () => {
        backToTop.classList.toggle("show", window.scrollY > 600);
    });

    backToTop.addEventListener("click", () => {
        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });
    });
</script>

<script src="js/easter-egg.js"></script>
