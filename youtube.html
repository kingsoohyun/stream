    <style>

        /* =========================================================
           YouTube Archive
           ========================================================= */

        .youtube-page {
            max-width: 1280px;
            margin: 0 auto;
            padding: 20px 24px 0;
        }

        /* ---------------------------------------------------------
           Toolbar
           --------------------------------------------------------- */

        .archive-toolbar {
            display: flex;
            align-items: center;
            margin-bottom: 16px;
        }

        .archive-filters {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        #tag-select {
            min-width: 90px;
        }

        #year-select {
            min-width: 60px;
        }

        #sort-select {
            min-width: 60px;
        }

        .sort-select {
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 7px 10px;
            height: 32px;
            background: #fff;
            color: #151922;
            font-size: 12px;
            cursor: pointer;
        }

        /* ---------------------------------------------------------
           Video Grid
           --------------------------------------------------------- */

        .youtube-grid {
            display: grid;
            grid-template-columns:
                repeat(4, minmax(0, 1fr));
            gap: 30px 20px;
        }

        .youtube-grid-control {
            display: flex;
            align-items: center;
            gap: 4px;
            margin-left: auto;
            margin-right: 8px;
            flex-shrink: 0;
        }

        .youtube-grid-control button {
            width: 26px;
            height: 26px;
            padding: 0;
            border: 1px solid #e5e7eb;
            border-radius: 6px;
            background: #fff;
            color: #151922;
            font-size: 16px;
            line-height: 1;
            cursor: pointer;
        }

        .youtube-grid-control span {
            min-width: 18px;
            text-align: center;
            font-size: 11px;
            color: #858b95;
        }

        /* ---------------------------------------------------------
           Video Card
           --------------------------------------------------------- */

        .video-card {
            display: block;
            color: inherit;
            text-decoration: none;
        }

        .video-thumb {
            position: relative;
            aspect-ratio: 16 / 9;
            overflow: hidden;
            background: #eee;
            border-radius: 10px;
        }

        .video-thumb img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform .3s ease;
        }

        .video-card:hover .video-thumb img {
            transform: scale(1.035);
        }

        .play-button {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);

            width: 48px;
            height: 34px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 9px;

            background: rgba(255, 255, 255, .65);
            color: #111;

            font-size: 15px;
        }


        /* ---------------------------------------------------------
           Video Information
           --------------------------------------------------------- */

        .video-info {
            padding-top: 13px;
        }

        .video-title {
            margin: 0;

            font-size: 15px;
            line-height: 1.45;
            font-weight: 600;

            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .video-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;

            margin-top: 8px;

            color: #888;
            font-size: 12px;
        }

        .video-views {
            color: #333;
            font-weight: 600;
        }

        .view-increase {
            color: #777;
        }


        /* ---------------------------------------------------------
           Loading / Error
           --------------------------------------------------------- */

        .loading {
            grid-column: 1 / -1;

            padding: 80px 20px;

            text-align: center;
            color: #888;
        }


        /* ---------------------------------------------------------
           Mobile
           --------------------------------------------------------- */

        @media (max-width: 700px) {
            .youtube-page {
                padding: 20px 12px 60px;
            }

            .archive-toolbar {
                padding: 20px 0;
            }

            .archive-filters {
                gap: 6px;
                width: auto;
            }

            .archive-filters .sort-select:nth-child(1) {
                width: 70px;
            }

            .archive-filters .sort-select:nth-child(2) {
                width: 85px;
            }

            .archive-filters .sort-select:nth-child(3) {
                width: 70px;
            }

            .sort-select {
                min-width: 0;
            }

            .youtube-grid {
                gap: 25px 12px;
            }

            .video-thumb {
                border-radius: 7px;
            }

            .play-button {
                width: 38px;
                height: 28px;
                border-radius: 7px;
                font-size: 12px;
            }

            .video-title {
                font-size: 13px;
            }

            .video-meta {
                font-size: 11px;
                gap: 5px;
            }
        }


        @media (max-width: 420px) {
            .youtube-grid {
                gap: 22px 10px;
            }

            .youtube-grid-control {
                display: none;
            }

            #year-select {
                display: none;
            }

            .archive-filters {
                margin-left: auto;
            }
        }


        /* ---------------------------------------------------------
           System Dark Mode
           --------------------------------------------------------- */

        @media (prefers-color-scheme: dark) {
            :root {
                color-scheme: dark;
            }

            html, body {
                background: #0f1114;
                color: #eceef1;
            }

            .site-header {
                background: #121418;
                border-color: #292d34;
            }

            .brand strong {

            }

            .brand span, .platform small, .section-head span {

            }

            .header-action a {

            }

            footer, .footer {
                background: #0f1114;
                border-color: #292d34;
                color: #858b95;
            }

            a {
                color: #9eb9d4;
            }

            .video-meta {
                color: #858b95;
            }

            .video-title {
                color: #eceef1;
            }

            .youtube-grid-control button {
                border-color: #30343b;
                background: #16191e;
                color: #eceef1;
            }

            .youtube-grid-control span {
                color: #858b95;
            }

            .sort-select {
                border-color: #30343b;
                background: #16191e;
                color: #eceef1;
                color-scheme: dark;
            }

            .video-thumb {
                background: #20242a;
            }

            .video-views {
                color: #C0A6B0;
                font-weight: 600;
            }

            .play-button {
                background: rgba(0, 0, 0, .58);
                color: rgba(255, 255, 255, .9);
            }

            .loading {
                color: #858b95;
            }
        }
    </style>

<script>

    let videos = [];
    let categories = [];

    let gridColumnCount =
        window.innerWidth <= 800
            ? 3
            : 4;


    // ---------------------------------------------------------
    // 숫자 포맷
    // ---------------------------------------------------------

    function formatNumber(number) {

        return Number(number || 0)
            .toLocaleString('en-US');

    }


    // ---------------------------------------------------------
    // YouTube JSON 불러오기
    // ---------------------------------------------------------

    async function loadVideos() {

        try {

            const [videoResponse, categoryResponse] =
                await Promise.all([
                    fetch('data/youtube.json'),
                    fetch('data/youtube_category.json')
                ]);


            if (!videoResponse.ok) {
                throw new Error(
                    'youtube.json을 불러올 수 없습니다.'
                );
            }

            if (!categoryResponse.ok) {
                throw new Error(
                    'youtube_category.json을 불러올 수 없습니다.'
                );
            }


            const data =
                await videoResponse.json();

            const categoryData =
                await categoryResponse.json();

            const updatedAt = data.updatedAt || '';

            const displayUpdatedAt =
                updatedAt.replace(/^(\d{4})-(\d{2})-(\d{2})/, '$1.$2.$3');

            document.getElementById(
                'common-info-tooltip'
            ).innerHTML =
                displayUpdatedAt
                    ? `조회수·좋아요 수는 YouTube 기준<br>업데이트 ${displayUpdatedAt}`
                    : '조회수·좋아요 수는 YouTube 기준';


            videos =
                Array.isArray(data.items)
                    ? data.items
                    : [];

            categories =
                Array.isArray(categoryData.categories)
                    ? categoryData.categories
                    : [];


            document
                .getElementById('video-count')
                .textContent =
                videos.length.toLocaleString();


            buildTagFilter();
            buildYearFilter();
            initializeFiltersFromUrl();
            renderVideos();
        } catch (error) {

            console.error(error);


            document
                .getElementById('youtube-grid')
                .innerHTML = `
                    <div class="loading">
                        영상을 불러오지 못했습니다.
                    </div>
                `;

        }

    }


    // ---------------------------------------------------------
    // Tag Filter 생성
    // ---------------------------------------------------------

    function buildTagFilter() {

        const select =
            document.getElementById(
                'tag-select'
            );


        const tagSet =
            new Set();

        videos.forEach(video => {

            if (!Array.isArray(video.tags)) {
                return;
            }

            video.tags.forEach(tag => {
                if (tag) {
                    tagSet.add(tag);
                }
            });

        });


        const categoryMap =
            new Map(
                categories.map(category => [
                    category.id,
                    category
                ])
            );


        // youtube_category.json의 배열 순서를 그대로 사용
        // 영상에 실제로 존재하는 카테고리만 표시
        const orderedTags =
            categories
                .map(category => category.id)
                .filter(tag => tagSet.has(tag));


        // 카테고리 JSON에 없는 태그가 있을 경우 마지막에 추가
        const remainingTags =
            [...tagSet].filter(
                tag => !categoryMap.has(tag)
            );


        const tags = [
            ...orderedTags,
            ...remainingTags
        ];


        select.innerHTML =
            '<option value="all">전체</option>';


        tags.forEach(tag => {

            const option =
                document.createElement(
                    'option'
                );

            option.value = tag;

            option.textContent =
                categoryMap.get(tag)?.name
                || tag;

            select.appendChild(option);
        });

        // 최초 로딩은 항상 전체
        select.value = 'all';
    }


    // ---------------------------------------------------------
    // Year Filter 생성
    // ---------------------------------------------------------
    function buildYearFilter() {
        const select =
            document.getElementById('year-select');

        const yearSet = new Set();

        videos.forEach(video => {
            if (!video.date) {
                return;
            }

            const year = String(video.date).split('.')[0];

            if (/^\d{4}$/.test(year)) {
                yearSet.add(year);
            }
        });

        const years =
            [...yearSet].sort((a, b) =>
                Number(b) - Number(a)
            );

        select.innerHTML =
            '<option value="all">전체 연도</option>';

        years.forEach(year => {
            const option =
                document.createElement('option');

            option.value = year;
            option.textContent = year;

            select.appendChild(option);
        });

        // 최초 로딩은 항상 전체
        select.value = 'all';
    }


    // ---------------------------------------------------------
    // 정렬
    // ---------------------------------------------------------

    function sortVideos(list, type) {
        return [...list].sort((a, b) => {
            if (type === 'views') {
                return (Number(b.views) || 0) - (Number(a.views) || 0);
            }

            if (type === 'likes') {
                return (Number(b.likes) || 0) - (Number(a.likes) || 0);
            }

            if (type === 'oldest') {
                return parseDate(a.date) - parseDate(b.date);
            }

            return parseDate(b.date) - parseDate(a.date);
        });
    }


    function initializeFiltersFromUrl() {
        const params = new URLSearchParams(window.location.search);

        const category = params.get('c');
        const year = params.get('y');
        const sort = params.get('s');

        const tagSelect = document.getElementById('tag-select');
        const yearSelect = document.getElementById('year-select');
        const sortSelect = document.getElementById('sort-select');

        if ([...tagSelect.options].some(option => option.value === category)) {
            tagSelect.value = category;
        } else {
            tagSelect.value = 'all';
        }

        if ([...yearSelect.options].some(option => option.value === year)) {
            yearSelect.value = year;
        } else {
            yearSelect.value = 'all';
        }

        if (['latest', 'oldest', 'views', 'likes'].includes(sort)) {
            sortSelect.value = sort;
        } else {
            sortSelect.value = 'latest';
        }
    }


    function updateUrl() {
        const url = new URL(window.location.href);

        const category = document.getElementById('tag-select').value;
        const year = document.getElementById('year-select').value;
        const sort = document.getElementById('sort-select').value;

        if (category === 'all') {
            url.searchParams.delete('c');
        } else {
            url.searchParams.set('c', category);
        }

        if (year === 'all') {
            url.searchParams.delete('y');
        } else {
            url.searchParams.set('y', year);
        }

        if (sort === 'latest') {
            url.searchParams.delete('s');
        } else {
            url.searchParams.set('s', sort);
        }

        history.replaceState(null, '', url);
    }
    // ---------------------------------------------------------
    // 날짜 변환
    // ---------------------------------------------------------

    function parseDate(date) {

        if (!date) {
            return 0;
        }


        const parts =
            String(date).split('.');


        if (parts.length !== 3) {
            return 0;
        }


        return new Date(
            Number(parts[0]),
            Number(parts[1]) - 1,
            Number(parts[2])
        ).getTime();

    }


    // ---------------------------------------------------------
    // 카드 생성
    // ---------------------------------------------------------

    function renderVideos() {

        const grid =
            document.getElementById(
                'youtube-grid'
            );


        const sortType =
            document
                .getElementById(
                    'sort-select'
                )
                .value;


        const selectedTag =
            document
                .getElementById(
                    'tag-select'
                )
                .value;

        const selectedYear =
            document
                .getElementById(
                    'year-select'
                )
                .value;


        // -----------------------------------------------------
        // Tag Filter
        // -----------------------------------------------------

        let excludedTags = [
            'disneyplus',
            'song'
        ];

        let filtered = videos.filter(video =>
            !excludedTags.some(tag =>
                Array.isArray(video.tags) && video.tags.includes(tag)
            )
        );

        if (selectedTag !== 'all') {
            filtered = filtered.filter(video =>
                Array.isArray(video.tags) && video.tags.includes(selectedTag)
            );
        }


        // -----------------------------------------------------
        // Year Filter
        // -----------------------------------------------------
        if (selectedYear !== 'all') {
            filtered =
                filtered.filter(video => {
                    if (!video.date) {
                        return false;
                    }

                    const year =
                        String(video.date).split('.')[0];

                    return year === selectedYear;
                });
        }

        // -----------------------------------------------------
        // Sort
        // -----------------------------------------------------

        const sorted =
            sortVideos(
                filtered,
                sortType
            );


        // -----------------------------------------------------
        // Count
        // -----------------------------------------------------

        document
            .getElementById(
                'video-count'
            )
            .textContent =
            sorted.length.toLocaleString();


        // -----------------------------------------------------
        // Empty
        // -----------------------------------------------------

        if (!sorted.length) {
            grid.innerHTML = `
                <div class="empty-quote">
                    <blockquote>
                        여러분이 보고 계신 지금 저의 모습이 99%일 수도, 1%일 수도
                    </blockquote>
                    <cite>
                        <strong>Exclusive Interview with Kim Soo Hyun</strong>
                        <br>
                        RCTI+, 2026.09.01.
                    </cite>
                </div>
            `;
            return;
        }


        const columnCount =
            window.innerWidth <= 420
                ? 2
                : gridColumnCount;

        document.getElementById('grid-count').textContent = columnCount;


        grid.style.gridTemplateColumns =
            `repeat(${columnCount}, minmax(0, 1fr))`;

        // -----------------------------------------------------
        // Cards
        // -----------------------------------------------------

        grid.innerHTML =
            sorted
                .map(video => {

                    const likes =
                        Number(
                            video.likes || 0
                        );


                    return `

                        <a
                            class="video-card"
                            href="${escapeHtml(video.url)}"
                            target="_blank"
                            rel="noopener noreferrer"
                        >

                            <div class="video-thumb">

                                <img
                                    src="${escapeHtml(video.thumbnail)}"
                                    alt=""
                                    loading="lazy"
                                >

                                <span class="play-button">
                                    ▶
                                </span>

                            </div>


                            <div class="video-info">

                                <h2 class="video-title">
                                    ${escapeHtml(video.title)}
                                </h2>


                                <div class="video-meta">

                                    <span>
                                        ${escapeHtml(
                        video.date || ''
                    )}
                                    </span>

                                    <span>·</span>

                                    <span class="video-views">
                                        ${formatNumber(
                        video.views
                    )}
                                    </span>

                                    <span>
                                        views
                                    </span>

                                    <span>
                                        ♥ ${formatNumber(likes)}
                                    </span>

                                </div>

                            </div>

                        </a>

                    `;

                })
                .join('');

    }


    // ---------------------------------------------------------
    // HTML Escape
    // ---------------------------------------------------------

    function escapeHtml(value) {

        return String(value ?? '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');

    }


    // ---------------------------------------------------------
    // 필터 변경
    // ---------------------------------------------------------

    document.getElementById('tag-select').addEventListener('change', () => {
        updateUrl();
        renderVideos();
    });

    document.getElementById('year-select').addEventListener('change', () => {
        updateUrl();
        renderVideos();
    });

    document.getElementById('sort-select').addEventListener('change', () => {
        updateUrl();
        renderVideos();
    });


    document
        .getElementById('grid-minus')
        .addEventListener('click', () => {

            if (gridColumnCount > 2) {
                gridColumnCount--;
                document.getElementById('grid-count').textContent = gridColumnCount;
                renderVideos();
            }

        });

    document
        .getElementById('grid-plus')
        .addEventListener('click', () => {

            if (gridColumnCount < 6) {
                gridColumnCount++;
                document.getElementById('grid-count').textContent = gridColumnCount;
                renderVideos();
            }

        });

    // ---------------------------------------------------------
    // 실행
    // ---------------------------------------------------------

    loadVideos();

    let resizeTimer;

    window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);

        resizeTimer = setTimeout(() => {
            renderVideos();
        }, 100);
    });

</script>


<script>
    const backToTop = document.getElementById("backToTop");

    window.addEventListener("scroll", () => {
        backToTop.classList.toggle("show", window.scrollY > 600);
    });

    backToTop.addEventListener("click", () => {
        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });
    });
</script>
