<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
    <title>KIM SOO HYUN STREAM</title>
    <meta name="description" content="Kim Soo Hyun 𝕏 content stream.">
    <link rel="stylesheet" href="style.css">

    <style>

        /* =========================================================
           Twitter Curation
           ========================================================= */

        .twitter-page {
            max-width: 1280px;
            margin: 0 auto;
            padding: 28px 24px 0;
        }

        /* ---------------------------------------------------------
           Toolbar
           --------------------------------------------------------- */

        .twitter-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .twitter-count {
            font-size: 12px;
            color: #858b95;
        }

        .twitter-count strong {
            color: #151922;
        }

        .twitter-filters {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .sort-select {
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 7px 10px;
            background: #fff;
            color: #151922;
            font-size: 12px;
            cursor: pointer;
        }


        /* ---------------------------------------------------------
           masonry + 가로 순서
           --------------------------------------------------------- */

        .twitter-archive-cards {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 18px;
            align-items: start;
        }

        .twitter-column {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }


        /* ---------------------------------------------------------
           Card
           --------------------------------------------------------- */

        .twitter-card {
            display: inline-block;
            width: 100%;
            box-sizing: border-box;
            margin: 0 0 18px;
            color: inherit;
            text-decoration: none;
            background: #fff;
            border: 1px solid #e8e9ed;
            border-radius: 10px;
            overflow: hidden;
            transition: .2s;
        }

        .twitter-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 22px rgba(20, 25, 35, .08);
        }


        /* ---------------------------------------------------------
           Thumbnail
           --------------------------------------------------------- */

        .twitter-thumbnail {
            width: 100%;
            height: auto;
            aspect-ratio: auto;
            object-fit: contain;
            display: block;
            background: #dfe2e7;
        }


        /* ---------------------------------------------------------
           Card Body
           --------------------------------------------------------- */

        .twitter-card-body {
            padding: 12px;
        }


        .twitter-account {
            display: flex;
            align-items: center;
            gap: 8px;
        }


        .twitter-account-icon {
            width: 30px;
            height: 30px;
            flex: 0 0 30px;
            border-radius: 50%;
            background: #111;
            color: #fff;
            display: grid;
            place-items: center;
            font-size: 13px;
            font-weight: 700;
        }


        .twitter-account-info {
            min-width: 0;
            flex: 1;
        }


        .twitter-display-name {
            font-size: 12px;
            font-weight: 700;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }


        .twitter-username {
            margin-top: 2px;
            font-size: 10px;
            color: #90959e;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }


        .twitter-date {
            margin-left: auto;
            align-self: flex-start;
            color: #90959e;
            font-size: 10px;
            white-space: nowrap;
        }


        /* ---------------------------------------------------------
           Description
           --------------------------------------------------------- */

        .twitter-title {
            font-size: 12px;
            line-height: 1.5;
            margin: 12px 0 0;

            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }


        /* ---------------------------------------------------------
           Empty / Loading
           --------------------------------------------------------- */

        .twitter-loading {
            grid-column: 1 / -1;
            padding: 70px 20px;
            text-align: center;
            color: #858b95;
            font-size: 12px;
        }


        /* ---------------------------------------------------------
           Mobile
           --------------------------------------------------------- */

        @media (max-width: 900px) {

            .twitter-archive-cards {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }

        }


        @media (max-width: 800px) {

            .twitter-page {
                padding: 16px 12px 0;
            }

            .twitter-filters {
                gap: 6px;
            }

            .archive-page-head h1 {
                font-size: 30px;
            }

            .twitter-archive-cards {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 12px;
            }

            .twitter-card-body {
                padding: 10px;
            }

            .twitter-account-icon {
                width: 26px;
                height: 26px;
                flex-basis: 26px;
                font-size: 11px;
            }

            .twitter-display-name {
                font-size: 11px;
            }

            .twitter-username,
            .twitter-date {
                font-size: 9px;
            }

            .twitter-title {
                font-size: 11px;
            }

        }


        @media (max-width: 480px) {

            .twitter-archive-cards {
                grid-template-columns: 1fr;
            }

        }


        /* ---------------------------------------------------------
           System Dark Mode
           --------------------------------------------------------- */

        @media (prefers-color-scheme: dark) {
            :root {
                color-scheme: dark;
            }

            html, body {
                background: #0f1114;
                color: #eceef1;
            }

            .site-header {
                background: #121418;
                border-color: #292d34;
            }

            .brand strong {
                color: #eceef1;
            }

            .brand span, .platform small, .section-head span {
                color: #858b95;
            }

            .header-action a {
                color: #fff;
            }

            footer, .footer {
                background: #0f1114;
                border-color: #292d34;
                color: #858b95;
            }

            a {
                color: #9eb9d4;
            }


            .archive-page-head .eyebrow,
            .archive-page-head p,
            .twitter-count,
            .twitter-meta,
            .twitter-date,
            .twitter-source,
            .twitter-stats,
            .twitter-info {
                color: #858b95;
            }

            .twitter-count strong,
            .twitter-card-body,
            .twitter-title,
            .twitter-text {
                color: #eceef1;
            }

            .sort-select {
                border-color: #30343b;
                background: #16191e;
                color: #eceef1;
                color-scheme: dark;
            }

            .twitter-card {
                background: #16191e;
                border-color: #292d34;
                box-shadow: 0 8px 22px rgba(0, 0, 0, .18);
            }

            .twitter-thumbnail {
                background: #20242a;
            }

            .twitter-account-icon {
                background: #eceef1;
                color: #111318;
            }
        }

    </style>
</head>


<body>


<!-- =======================================================
     Header
     ======================================================= -->

<header class="site-header">
    <div class="brand">
        <a href="index.html">
            <strong>KIM SOO HYUN STREAM</strong>
            <span>배우 김수현 콘텐츠 큐레이션 팬 페이지</span>
        </a>
    </div>

    <nav class="header-action">
        <a href="rights.html">
            PRIVACY &amp; RIGHTS
        </a>
    </nav>
</header>


<!-- =======================================================
     Main
     ======================================================= -->

<main class="twitter-page">

    <!-- =====================================================
         Toolbar
         ===================================================== -->

    <div class="twitter-toolbar">

        <div class="twitter-count">

            전체
            <strong id="tweet-count">-</strong>
            개

        </div>


        <div class="twitter-filters">

            <select
                    id="category-select"
                    class="sort-select"
                    aria-label="카테고리 필터"
            >
                <option value="all">전체</option>
            </select>

            <select
                    id="sort-select"
                    class="sort-select"
                    aria-label="정렬"
            >

                <option value="latest">
                    최신순
                </option>

                <option value="oldest">
                    오래된순
                </option>

            </select>

        </div>

    </div>


    <!-- =====================================================
         Tweet Grid
         ===================================================== -->

    <section
            id="twitter-cards"
            class="twitter-archive-cards"
            aria-label="Twitter 콘텐츠 목록"
    >

        <div class="twitter-loading">
            콘텐츠를 불러오는 중...
        </div>
    </section>
</main>

<footer>
    <div class="footer-notice">
        <p>
            <strong>KIM SOO HYUN STREAM</strong> is an unofficial, non-commercial fan site. All content belongs to its
            respective copyright holders and original creators and is linked to its original source.
        </p>
    </div>
</footer>

<button
        type="button"
        class="back-to-top"
        id="backToTop"
        aria-label="맨 위로"
        title="맨 위로"
>
    ↑
</button>

<script>

    let tweets = [];
    let categories = [];


    // -------------------------------------------------------
    // 날짜 변환
    // -------------------------------------------------------

    function parseDate(date) {

        if (!date) {
            return 0;
        }

        const parts =
            String(date).split('.');

        if (parts.length !== 3) {
            return 0;
        }

        return new Date(
            Number(parts[0]),
            Number(parts[1]) - 1,
            Number(parts[2])
        ).getTime();

    }


    // -------------------------------------------------------
    // HTML Escape
    // -------------------------------------------------------

    function escapeHtml(value) {

        return String(value ?? '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');

    }


    // -------------------------------------------------------
    // JSON Load
    // -------------------------------------------------------

    async function loadTweets() {

        try {

            const response =
                await fetch(
                    'data/tweets.json'
                );


            if (!response.ok) {

                throw new Error(
                    'twitter.json을 불러오지 못했습니다.'
                );

            }


            const data =
                await response.json();


            tweets =
                Array.isArray(data.items)
                    ? data.items
                    : [];

            categories =
                Array.isArray(data.categories)
                    ? data.categories
                    : [];


            buildCategoryFilter();


            document
                .getElementById('tweet-count')
                .textContent =
                tweets.length.toLocaleString();


            renderTweets();


        } catch (error) {

            console.error(error);


            document
                .getElementById('twitter-cards')
                .innerHTML = `

                <div class="twitter-loading">
                    콘텐츠를 불러오지 못했습니다.
                </div>

            `;

        }

    }


    // -------------------------------------------------------
    // Category Filter
    // -------------------------------------------------------

    function buildCategoryFilter() {

        const select =
            document.getElementById(
                'category-select'
            );


        const sortedCategories =
            [...categories].sort(
                (a, b) =>
                    Number(a.order || 999)
                    -
                    Number(b.order || 999)
            );

        select.innerHTML =
            '<option value="all">전체</option>';


        sortedCategories.forEach(category => {

            const option =
                document.createElement('option');

            option.value =
                category.id || '';

            option.textContent =
                category.name ||
                category.id ||
                '';

            select.appendChild(option);

        });


        // 최초 진입 시 기본 카테고리
        // URL category
        const params = new URLSearchParams(window.location.search);
        const urlCategory = params.get('c');

// URL에 유효한 category가 있으면 적용
        if (
            urlCategory === 'all' ||
            [...select.options].some(option => option.value === urlCategory)
        ) {
            select.value = urlCategory;
        } else {
            select.value = 'bday';
        }

    }


    function getTweetCategory(tweet) {

        if (tweet.category) {
            return tweet.category;
        }


        if (!Array.isArray(tweet.tags)) {
            return null;
        }


        for (const category of categories) {

            const categoryName =
                String(category.name || '').trim();


            if (!categoryName) {
                continue;
            }


            if (
                tweet.tags.some(tag =>
                    String(tag || '')
                        .trim()
                        .startsWith(categoryName)
                )
            ) {
                return category.id;
            }

        }


        return null;

    }


    // -------------------------------------------------------
    // Sort
    // -------------------------------------------------------

    function sortTweets(list, type) {

        return [...list].sort(
            (a, b) => {

                const dateA =
                    parseDate(a.date);

                const dateB =
                    parseDate(b.date);


                if (type === 'oldest') {

                    return dateA - dateB;

                }


                return dateB - dateA;

            }
        );

    }


    // -------------------------------------------------------
    // Render
    // -------------------------------------------------------

    function renderTweets() {

        const container =
            document.getElementById('twitter-cards');

        const sortType =
            document
                .getElementById('sort-select')
                .value;

        const selectedCategory =
            document
                .getElementById('category-select')
                .value;


        // -------------------------------------------------------
        // Filter
        // -------------------------------------------------------

        let filtered = tweets;

        if (selectedCategory !== 'all') {

            filtered =
                tweets.filter(
                    tweet =>
                        getTweetCategory(tweet)
                        === selectedCategory
                );

        }


        // -------------------------------------------------------
        // Sort
        // -------------------------------------------------------

        const sorted =
            sortTweets(
                filtered,
                sortType
            );


        document
            .getElementById('tweet-count')
            .textContent =
            sorted.length.toLocaleString();


        // -------------------------------------------------------
        // Empty
        // -------------------------------------------------------

        if (!sorted.length) {

            container.innerHTML = `

            <div class="twitter-loading">
                등록된 콘텐츠가 없습니다.
            </div>

        `;

            return;

        }


        // -------------------------------------------------------
        // Column count
        // -------------------------------------------------------

        const columnCount =
            window.innerWidth <= 480 ? 1 :
                window.innerWidth <= 800 ? 2 :
                    window.innerWidth <= 900 ? 3 :
                        4;


        // -------------------------------------------------------
        // Create columns
        // -------------------------------------------------------

        container.innerHTML = '';

        const columns =
            Array.from(
                { length: columnCount },
                () => {

                    const column =
                        document.createElement('div');

                    column.className =
                        'twitter-column';

                    container.appendChild(column);

                    return column;

                }
            );


        // -------------------------------------------------------
        // Create cards
        // -------------------------------------------------------

        sorted.forEach((tweet, index) => {

            const username =
                tweet.username
                    ? '@' + tweet.username
                    : '𝕏';


            const thumbnail =
                tweet.thumbnail || '';


            const card =
                document.createElement('a');

            card.href =
                tweet.url || '#';

            card.target =
                '_blank';

            card.rel =
                'noopener noreferrer';

            card.className =
                'twitter-card';


            card.innerHTML = `

            ${
                thumbnail

                    ? `

                    <img
                        class="twitter-thumbnail"
                        src="${escapeHtml(thumbnail)}"
                        alt=""
                        loading="lazy"
                    >

                `

                    : `

                    <div
                        class="twitter-thumbnail"
                        style="
                            display:grid;
                            place-items:center;
                            color:#858b95;
                            font-size:24px;
                        "
                    >
                        𝕏
                    </div>

                `
            }


            <div class="twitter-card-body">

                <div class="twitter-account">
    <div class="twitter-account-info">
        <div class="twitter-username">
            ${escapeHtml(username)}
        </div>
    </div>

    ${
                tweet.date
                    ? `
                <div class="twitter-date">
                    ${escapeHtml(tweet.date)}
                </div>
            `
                    : ''
            }
</div>

            </div>

        `;


            // ---------------------------------------------------
            // Important:
            // index 0 → column 1
            // index 1 → column 2
            // index 2 → column 3
            // index 3 → column 4
            // index 4 → column 1
            // ---------------------------------------------------

            columns[index % columnCount]
                .appendChild(card);

        });

    }


    // -------------------------------------------------------
    // Category Change
    // -------------------------------------------------------

    document
        .getElementById('category-select')
        .addEventListener(
            'change',
            function () {

                const value = this.value;

                const url =
                    new URL(window.location.href);

                if (value === 'all') {
                    url.searchParams.set('c', 'all');
                } else {
                    url.searchParams.set('c', value);
                }

                history.replaceState(
                    null,
                    '',
                    url
                );

                renderTweets();

            }
        );


    // -------------------------------------------------------
    // Sort Change
    // -------------------------------------------------------

    document
        .getElementById('sort-select')
        .addEventListener(
            'change',
            renderTweets
        );


    // -------------------------------------------------------
    // Start
    // -------------------------------------------------------

    loadTweets();

</script>

<script>
    const backToTop = document.getElementById("backToTop");

    window.addEventListener("scroll", () => {
        backToTop.classList.toggle("show", window.scrollY > 600);
    });

    backToTop.addEventListener("click", () => {
        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });
    });
</script>

</body>
</html>
