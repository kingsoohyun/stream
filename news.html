<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>NEWS | KIM SOO HYUN STREAM</title>

    <meta
            name="description"
            content="Kim Soo Hyun news archive."
    >

    <link rel="stylesheet" href="style.css">

    <style>

        /* =========================================================
           News Archive
           ========================================================= */

        .news-page {
            max-width: 1200px;
            margin: auto;
            padding: 42px 20px;
        }


        /* ---------------------------------------------------------
           Toolbar
           --------------------------------------------------------- */

        .news-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .news-count {
            font-size: 12px;
            color: #858b95;
        }

        .news-count strong {
            color: #151922;
        }

        .news-filters {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .sort-select {
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 7px 10px;
            background: #fff;
            color: #151922;
            font-size: 12px;
            cursor: pointer;
        }


        /* ---------------------------------------------------------
           News List
           --------------------------------------------------------- */

        .news-list {
            background: #fff;
            border-top: 1px solid #e5e7eb;
        }

        .news-item {
            display: grid;
            grid-template-columns: 145px 115px 1fr auto;
            align-items: center;
            gap: 16px;

            min-height: 58px;
            padding: 10px 4px;

            border-bottom: 1px solid #e8e9ed;

            color: inherit;
            text-decoration: none;
        }

        .news-item:hover {
            background: #fafafa;
        }


        /* ---------------------------------------------------------
           Date
           --------------------------------------------------------- */

        .news-date {
            color: #90959e;
            font-size: 11px;
            white-space: nowrap;
        }


        /* ---------------------------------------------------------
           Source
           --------------------------------------------------------- */

        .news-source {
            position: relative;
            width: fit-content;

            color: #151922;
            font-size: 12px;
            font-weight: 600;

            cursor: pointer;
            white-space: nowrap;
        }

        .news-source:hover {
            text-decoration: underline;
        }

        .news-source::after {
            content: attr(data-reporter);

            position: absolute;
            left: 0;
            bottom: calc(100% + 7px);

            padding: 6px 8px;

            background: #151922;
            color: #fff;

            border-radius: 5px;

            font-size: 10px;
            font-weight: 400;
            line-height: 1.3;

            white-space: nowrap;

            opacity: 0;
            visibility: hidden;
            pointer-events: none;

            transition: opacity .15s;
            z-index: 10;
        }

        .news-source:hover::after {
            opacity: 1;
            visibility: visible;
        }


        /* ---------------------------------------------------------
           Title
           --------------------------------------------------------- */

        .news-title {
            min-width: 0;

            color: #151922;
            font-size: 13px;
            line-height: 1.5;

            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .news-title:hover {
            text-decoration: underline;
        }


        /* ---------------------------------------------------------
           Tags
           --------------------------------------------------------- */

        .news-tags-inline {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 5px;

            white-space: nowrap;
        }

        .news-tag {
            color: #858b95;
            font-size: 10px;
        }


        /* ---------------------------------------------------------
           Empty / Loading
           --------------------------------------------------------- */

        .news-loading {
            padding: 70px 20px;
            text-align: center;
            color: #858b95;
            font-size: 12px;
        }


        /* ---------------------------------------------------------
           Mobile
           --------------------------------------------------------- */

        @media (max-width: 800px) {

            .news-page {
                padding: 28px 12px;
            }

            .news-toolbar {
                align-items: flex-start;
                gap: 12px;
            }

            .news-filters {
                gap: 6px;
            }

            .sort-select {
                max-width: 120px;
            }

            .news-item {
                grid-template-columns: 1fr auto;
                gap: 4px 12px;
                padding: 12px 4px;
            }

            .news-date {
                grid-column: 1;
                grid-row: 1;
                font-size: 10px;
            }

            .news-source {
                grid-column: 2;
                grid-row: 1;
                justify-self: end;
                font-size: 11px;
            }

            .news-title {
                grid-column: 1 / -1;
                grid-row: 2;

                font-size: 12px;
                white-space: normal;

                display: -webkit-box;
                -webkit-line-clamp: 2;
                -webkit-box-orient: vertical;
            }

            .news-tags-inline {
                grid-column: 1 / -1;
                grid-row: 3;

                justify-content: flex-start;
                margin-top: 3px;
            }

        }


        @media (max-width: 480px) {

            .news-toolbar {
                flex-direction: column;
            }

            .news-filters {
                width: 100%;
            }

            .sort-select {
                flex: 1;
                max-width: none;
            }

        }

    </style>
</head>


<body>

<header class="site-header">

    <div class="brand">
        <a href="index.html">
            <strong>KIM SOO HYUN STREAM</strong>
            <span>배우 김수현 콘텐츠 큐레이션</span>
        </a>
    </div>

</header>


<main class="news-page">


    <!-- =========================================================
         News Toolbar
         ========================================================= -->

    <div class="news-toolbar">

        <div class="news-count">
            전체 <strong id="news-count">-</strong>개
        </div>


        <div class="news-filters">

            <select
                    id="tag-select"
                    class="sort-select"
                    aria-label="기사 태그 필터"
            >
                <option value="all">전체</option>
            </select>


            <select
                    id="sort-select"
                    class="sort-select"
                    aria-label="정렬"
            >
                <option value="latest">최신순</option>
                <option value="oldest">오래된순</option>
            </select>

        </div>

    </div>


    <!-- =========================================================
         News List
         ========================================================= -->

    <section
            id="news-list"
            class="news-list"
            aria-label="뉴스 기사 목록"
    >

        <div class="news-loading">
            기사를 불러오는 중...
        </div>

    </section>


</main>


<footer>

    <div class="footer-notice">

        <p>
            KIM SOO HYUN STREAM is a non-commercial content curation site and is not for sale.
            All content remains the property of their respective copyright holders and original creators.
            All posts are linked to their original sources.
        </p>

    </div>

</footer>


<script src="news.js"></script>

</body>
</html>
